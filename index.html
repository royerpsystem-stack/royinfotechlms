<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5"><title>Roy Infotech LMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f4f5fb;--c:#fff;--t:#1e1b2e;--m:#6b7280;--b:#e5e7eb}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t);line-height:1.5}
header{background:#fff;border-bottom:1px solid var(--b);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:8px;flex-wrap:wrap}
.hi{font-size:14px;font-weight:600;color:var(--p);padding:8px 6px}.logo{display:flex;align-items:center;gap:10px;cursor:pointer}.lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.logo b{font-size:18px;line-height:1.1}.logo small{display:block;color:var(--m);font-size:11px;font-weight:500}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{background:transparent;color:var(--t);padding:8px 12px;font-size:14px}nav button:hover{background:#eef2ff;color:var(--p)}nav .pr{background:var(--p);color:#fff}
main{max-width:1000px;margin:0 auto;padding:16px}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none}
button.g{background:#fff;color:var(--p);border:1px solid var(--p)}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#db2777);color:#fff;border-radius:20px;padding:44px 24px;text-align:center;margin-bottom:22px}
.hero h1{font-size:clamp(26px,6vw,42px);line-height:1.2;margin-bottom:12px}.hero p{opacity:.92;max-width:560px;margin:0 auto 22px;font-size:clamp(15px,3.5vw,18px)}
.hero .btn{background:#fff;color:var(--p);margin:4px}.hero .btn.o{background:transparent;color:#fff;border:2px solid #fff}
.feat{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:26px}
.ft{background:#fff;border:1px solid var(--b);border-radius:14px;padding:16px;text-align:center}.ft i{font-style:normal;font-size:28px;display:block}.ft b{display:block;margin:4px 0 2px}.ft span{color:var(--m);font-size:13px}
.sec{font-size:24px;margin:6px 0 14px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px #0000000a}
.card.pad{padding:16px;gap:10px}.cb{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.th{height:140px;display:grid;place-items:center;color:#fff;font-size:44px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--p2))}
.card h3{font-size:18px}.m{color:var(--m);font-size:14px}.price{font-size:22px;font-weight:800;color:var(--p)}
.cb .btn,.cb button,.cb .tag{margin-top:auto}
input,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font-size:16px;margin:4px 0;font-family:inherit}
.box{max-width:400px;margin:24px auto}.v{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin:12px 0}
.v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.les{padding:12px;border:1px solid var(--b);background:#fff;border-radius:10px;margin:6px 0;cursor:pointer}.les.on{border-color:var(--p);background:#eef2ff}
.tag{font-size:13px;padding:6px 10px;border-radius:99px;background:#fef3c7;text-align:center}.tag.ok{background:#d1fae5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer{background:#1e1b2e;color:#c9c7d6;margin-top:36px;padding:28px 16px;text-align:center;font-size:14px}
footer b{color:#fff;font-size:18px;display:block;margin-bottom:6px}footer a{color:#fff}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
h2{margin:8px 0 12px}
.tag.no{background:#fee2e2}label{font-size:13px;font-weight:600;color:var(--m);display:block;margin-top:8px}.mini{padding:6px 10px;font-size:13px}.ls{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px;margin:4px 0;font-size:14px}.adm-th{height:90px}
.lg{overflow:hidden;background:#fff;border:1px solid var(--b)}.lg img{width:40px;height:40px;object-fit:cover;display:block}
</style></head><body>
<header><div class="logo" onclick="go('home')"><div class="lg"><img src="ROY LOGO.jpg" alt="Roy Infotech"></div><b>Roy Infotech<small>Coaching &amp; Computer Institute</small></b></div><nav id="nav"></nav></header>
<main id="app">Loading...</main>
<footer id="ft"></footer><div id="toast"></div>
<script>
// ====== SETTINGS ======
const SUPABASE_URL="https://ebtusddbqeetiuxaionx.supabase.co";
const SUPABASE_KEY="sb_publishable_nG23Z21K7OQg8MEweb6rrg__YlbRSJK";
const UPI_ID="9060180354@ybl";
const UPI_NAME="Roy Infotech";
const PHONE="919060180354";   // WhatsApp number (91 ke saath)
const EMAIL="royinfotech@gmail.com";
const ADDRESS="Patna, Bihar";
// ======================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
let me=null,prof=null,courses=[],enr=[],view="home",cur=null,lessons=[],lesson=null,authMode="login";
const nm=()=>{let n=(prof?.name||me?.user_metadata?.name||(me?.email||"").split("@")[0]||"").trim().split(" ")[0];return n.charAt(0).toUpperCase()+n.slice(1)};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3000)};
const yid=u=>{const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(String(u).length==11?u:null)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(){
 const {data:{session}}=await sb.auth.getSession();me=session?.user||null;
 if(me){
  await sb.from("lms_profiles").insert({id:me.id,email:me.email,name:me.user_metadata?.name||""});
  prof=(await sb.from("lms_profiles").select("*").eq("id",me.id).single()).data;
  enr=(await sb.from("lms_enrollments").select("*").eq("user_id",me.id)).data||[];
 }else{prof=null;enr=[]}
 courses=(await sb.from("lms_courses").select("*").order("id",{ascending:false})).data||[];
 render();
}
const th=c=>c.thumb?`<img class="th" src="${esc(c.thumb)}" alt="" style="width:100%;object-fit:cover">`:`<div class="th">${esc(c.title.charAt(0).toUpperCase())}</div>`;
const st=cid=>enr.find(e=>e.course_id==cid)?.status;
function go(v){view=v;render()}
function render(){
 $("#ft").innerHTML=`<b>Roy Infotech</b>${ADDRESS}<br>📞 <a href="https://wa.me/${PHONE}">WhatsApp</a> · ✉️ ${EMAIL}<br><br>© ${new Date().getFullYear()} Roy Infotech. All rights reserved.`;
 const adm=prof?.role==="admin";
 $("#nav").innerHTML=(me?`<span class="hi">👋 ${esc(nm())}</span><button onclick="go('home')">Home</button><button onclick="go('my')">My Learning</button>${adm?`<button onclick="go('admin')">Admin</button>`:""}<button onclick="out()">Logout</button>`:`<button class="pr" onclick="go('auth')">Login / Signup</button>`);
 const a=$("#app");
 if(view==="auth"&&!me)return a.innerHTML=authH();
 if(view==="my"&&me)return myH();
 if(view==="watch")return watchH();
 if(view==="admin"&&adm)return adminH();
 a.innerHTML=`<section class="hero">${me?`<div style="font-size:18px;font-weight:600;margin-bottom:8px">Namaste, ${esc(nm())} 👋</div>`:""}<h1>Apna Career Banao,<br>Roy Infotech ke Saath</h1><p>Expert teachers se online seekho. Mobile par kahin bhi, kabhi bhi. Course kharido aur turant padhna shuru karo.</p><a class="btn" href="#courses">Courses Dekho</a><a class="btn o" href="https://wa.me/${PHONE}" target="_blank">WhatsApp par Pucho</a></section>
<div class="feat"><div class="ft"><i>👨‍🏫</i><b>Expert Teaching</b><span>Aasan bhasha mein padhai</span></div><div class="ft"><i>📱</i><b>Mobile Friendly</b><span>Phone par app jaisa experience</span></div><div class="ft"><i>▶️</i><b>Video Lectures</b><span>Jab chaho tab dekho</span></div><div class="ft"><i>💳</i><b>Easy UPI Payment</b><span>Pay karo, turant approval</span></div></div>
<h2 class="sec" id="courses">Hamare Courses</h2><div class="grid">${courses.map(c=>`<div class="card">${th(c)}<div class="cb"><h3>${esc(c.title)}</h3><p class="m">${esc(c.description)}</p><div class="price">${c.price?"₹"+c.price:"Free"}</div>${btn(c)}</div></div>`).join("")||"<div class='card pad'><b>Naye courses jald aa rahe hain 🚀</b><p class=m>Jaankari ke liye humse WhatsApp par sampark karo.</p></div>"}</div>`;
}
function btn(c){const s=st(c.id);
 if(s==="approved")return`<button onclick="open_(${c.id})">▶ Dekho</button>`;
 if(s==="pending")return`<span class="tag">⏳ Payment verify ho rahi hai</span>`;
 return`<button onclick="buy(${c.id})">Buy Now</button>`}
function authH(){const L=authMode==="login";return`<div class="card pad box"><h2>${L?"Login":"Naya Account"}</h2>${L?"":`<input id="nm" placeholder="Aapka naam">`}<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6)"><button onclick="auth()">${L?"Login":"Signup"}</button><p class="m" style="text-align:center;cursor:pointer" onclick="authMode='${L?"signup":"login"}';render()">${L?"Naya account banao":"Pehle se account hai? Login"}</p></div>`}
async function auth(){
 const email=$("#em").value.trim(),password=$("#pw").value;
 let r;
 if(authMode==="login")r=await sb.auth.signInWithPassword({email,password});
 else r=await sb.auth.signUp({email,password,options:{data:{name:$("#nm").value}}});
 if(r.error)return toast(r.error.message);
 if(!r.data.session)return toast("Email check karke confirm karo, phir login karo");
 view="home";await load();toast("Welcome, "+nm()+" 👋");
}
async function out(){await sb.auth.signOut();view="home";load()}
function buy(id){
 if(!me){view="auth";return render()}
 const c=courses.find(x=>x.id==id);
 if(!c.price){return sb.from("lms_enrollments").insert({user_id:me.id,email:me.email,course_id:id,status:"pending"}).then(()=>{toast("Request bhej di");load()})}
 const link=`upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(UPI_NAME)}&am=${c.price}&cu=INR&tn=${encodeURIComponent(c.title)}`;
 $("#app").innerHTML=`<div class="card pad box"><h2>${esc(c.title)}</h2><div class="price">₹${c.price}</div><p class="m">1. QR scan karke ₹${c.price} pay karo (UPI ID: <b>${esc(UPI_ID)}</b>)<br>2. Payment ke baad UTR / Transaction ID niche daalo</p><div id="qr" style="display:grid;place-items:center;margin:6px 0"></div><p class="m" style="text-align:center">QR scan karo, ya phone par neeche button dabao</p><a class="btn" href="${link}" style="text-align:center;text-decoration:none">UPI App se Pay karo</a><input id="utr" placeholder="UTR / Transaction ID"><button onclick="submitUtr(${id})">Maine pay kar diya</button><button class="g" onclick="go('home')">Wapas</button></div>`;
 new QRCode($("#qr"),{text:link,width:200,height:200});
}
async function submitUtr(id){
 const utr=$("#utr").value.trim();if(utr.length<6)return toast("Sahi UTR daalo");
 const {error}=await sb.from("lms_enrollments").insert({user_id:me.id,email:me.email,course_id:id,utr,status:"pending"});
 if(error)return toast(error.message);toast("Submit ho gaya! Approval ka wait karo");view="home";load();
}
function myH(){
 const mine=courses.filter(c=>st(c.id));
 $("#app").innerHTML=`<h2>My Learning</h2><div class="grid">${mine.map(c=>`<div class="card">${th(c)}<div class="cb"><h3>${esc(c.title)}</h3>${btn(c)}</div></div>`).join("")||"<p class=m>Aapne abhi koi course nahi liya.</p>"}</div>`;
}
async function open_(id){
 cur=courses.find(c=>c.id==id);
 lessons=(await sb.from("lms_lessons").select("*").eq("course_id",id).order("position")).data||[];
 lesson=lessons[0]||null;view="watch";render();
}
function watchH(){
 $("#app").innerHTML=`<button class="g" onclick="go('my')">← Wapas</button><h2 style="margin-top:12px">${esc(cur.title)}</h2>${lesson?`<div class="v"><iframe src="https://www.youtube-nocookie.com/embed/${lesson.youtube_id}?rel=0&modestbranding=1" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen></iframe></div><h3>${esc(lesson.title)}</h3>`:"<p class=m>Lectures jald aayenge.</p>"}<div style="margin-top:12px">${lessons.map(l=>`<div class="les ${l.id==lesson?.id?"on":""}" onclick="lesson=lessons.find(x=>x.id==${l.id});watchH()">▶ ${esc(l.title)}</div>`).join("")}</div>`;
}
let tab="pay";
async function adminH(){
 const [pr,lr]=await Promise.all([sb.from("lms_enrollments").select("*").order("id",{ascending:false}),sb.from("lms_lessons").select("*").order("position")]);
 const P=pr.data||[],L=lr.data||[],cn=id=>courses.find(c=>c.id==id)?.title||id,pend=P.filter(p=>p.status=="pending").length;
 const T=(k,l)=>`<button class="${tab==k?"":"g"}" onclick="tab='${k}';adminH()">${l}</button>`;
 let h=`<h2>⚙️ Admin Panel</h2><div class="row" style="justify-content:flex-start;margin-bottom:14px">${T("pay","💰 Payments"+(pend?" ("+pend+")":""))}${T("crs","📚 Mere Courses")}${T("new","➕ Naya Course")}</div>`;
 if(tab=="pay")h+=P.map(p=>`<div class="card pad" style="margin:8px 0"><div class="row"><b>${esc(p.email)}</b><span class="tag ${p.status=="approved"?"ok":p.status=="rejected"?"no":""}">${p.status}</span></div><div class="m">📚 ${esc(cn(p.course_id))}<br>🔢 UTR: ${esc(p.utr||"-")}<br>🕒 ${new Date(p.created_at).toLocaleString("en-IN")}</div>${p.status=="pending"?`<div class="row"><button onclick="setS(${p.id},'approved')">✅ Approve</button><button class="g" onclick="setS(${p.id},'rejected')">❌ Reject</button></div>`:""}</div>`).join("")||"<p class=m>Abhi koi payment request nahi hai.</p>";
 if(tab=="crs")h+=courses.map(c=>{const ls=L.filter(l=>l.course_id==c.id);return`<div class="card" style="margin:12px 0">${c.thumb?`<img class="th adm-th" src="${esc(c.thumb)}" style="width:100%;object-fit:cover">`:""}<div class="cb"><div class="row"><div><h3>${esc(c.title)}</h3><span class="m">${c.price?"₹"+c.price:"Free"} · ${ls.length} lectures</span></div><button class="g mini" onclick="delC(${c.id})">🗑 Course Delete</button></div>${ls.map((l,i)=>`<div class="ls"><span>${i+1}. ${esc(l.title)}</span><button class="g mini" onclick="delL(${l.id})">✕</button></div>`).join("")||"<p class=m>Abhi koi lecture nahi hai.</p>"}<label>Naya Lecture</label><input id="lt${c.id}" placeholder="Lecture ka naam"><input id="ly${c.id}" placeholder="YouTube unlisted video ka link"><button onclick="addL(${c.id})">+ Lecture Add Karo</button></div></div>`}).join("")||"<p class=m>Pehle 'Naya Course' tab se course banao.</p>";
 if(tab=="new")h+=`<div class="card pad"><label>Course ka naam</label><input id="ct" placeholder="Jaise: Basic Computer Course"><label>Description</label><textarea id="cd" rows="3" placeholder="Course mein kya sikhaya jayega"></textarea><label>Price (₹) — free ke liye 0</label><input id="cp" type="number" placeholder="999"><label>Banner image ka link (optional)</label><input id="cth" placeholder="https://.../banner.jpg"><button onclick="addC()">✅ Course Banao</button></div>`;
 $("#app").innerHTML=h;
}
async function delL(id){if(!confirm("Lecture delete karna hai?"))return;await sb.from("lms_lessons").delete().eq("id",id);adminH()}
async function setS(id,s){await sb.from("lms_enrollments").update({status:s}).eq("id",id);adminH()}
async function addC(){const {error}=await sb.from("lms_courses").insert({title:$("#ct").value,description:$("#cd").value,price:+$("#cp").value||0,thumb:$("#cth").value.trim()||null});if(error)return toast(error.message);toast("Course ban gaya! Ab lecture add karo");await load();view="admin";tab="crs";adminH()}
async function delC(id){if(!confirm("Delete karna hai?"))return;await sb.from("lms_courses").delete().eq("id",id);await load();view="admin";adminH()}
async function addL(cid){
 const y=yid($("#ly"+cid).value),t=$("#lt"+cid).value;if(!y||!t)return toast("Naam aur sahi YouTube link daalo");
 const n=((await sb.from("lms_lessons").select("id",{count:"exact"}).eq("course_id",cid)).count)||0;
 const {error}=await sb.from("lms_lessons").insert({course_id:cid,title:t,youtube_id:y,position:n+1});
 if(error)return toast(error.message);toast("Lecture add ho gaya");adminH();
}
load();
</script></body></html>
